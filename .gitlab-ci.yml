stages:
  - check
  - build
  - release
  - verdict
  - gate

variables:
  CARGO_HOME: ${CI_PROJECT_DIR}/.cargo
  RUST_BACKTRACE: "1"
  # Pinned to a real version tag + digest per ADOPTION.md's
  # <name>:<semver>@sha256:<digest> convention for self-published images.
  # Was ":latest" behind $RUST_IMAGE indirection (image: $RUST_IMAGE at the
  # three usage sites below) -- invisible to Renovate's built-in docker
  # manager either way (no built-in manager resolves a $VAR-indirected
  # image: value), so this floated untracked with no MR trail.
  RUST_IMAGE: registry.gitlab.com/nomograph/pipeline/rust-cli:v5.10.0@sha256:ad44848a2175f7068f8f05106d05e887d111128fc75f40081a19dddaf4b4ea2b

default:
  tags:
    - storr

# osv-verdict + automerge-gate (renovate single-maintainer campaign,
# Go OSV coverage-gap closure): behest had NO vulnerability scanning
# at all, in a repo that is a network-facing credential broker. Scoped
# to sdk/ (scan_path) rather than the whole tree: this closes the Go
# gap that motivated the check; agent/ (Rust, gtk3-rs bindings) and
# worker/ (npm) carry their own separate, larger finding sets --
# several of them permanently-unfixable "upstream unmaintained" RUSTSEC
# advisories against the abandoned gtk3-rs stack -- that need an
# operator decision (ignore-list policy vs. a GUI framework migration)
# before they can gate main. Tracked as follow-up, not silently
# dropped. See sdk/osv-scanner.toml for the one accepted, non-reachable
# finding this scope still carries (GO-2026-5932, openpgp is
# unmaintained upstream with no fix; sdk only imports nacl/box).
# osv-verdict emits CHECK_OSV via dotenv (newly-introduced findings
# only on MRs); automerge-gate consumes it over needs: and blocks
# unless every required check is present and pass.
#
# secret-verdict (first secret detection this repo has ever run): behest
# is a network-facing credential broker, so a committed credential is the
# failure mode it can least afford. GitLab's own Secret-Detection template
# cannot block one -- its analyzer runs gitleaks with `--exit-code 0` and
# exits 0 holding findings -- so this is the verdict component, which
# reads the report and blocks on a non-empty vulnerabilities array. Unlike
# osv-verdict it also exits 1, so a leak reddens the pipeline directly.
# Whole-tree, not scoped: osv-verdict's `sdk` scope is about which
# dependency trees are triageable today; a leaked credential in agent/ or
# worker/ is not less leaked.
#
# All three pins move to v5.10.0 together, deliberately: automerge-gate
# only grew its `needs:` on the secret job in v5.10.0 (without it
# CHECK_SECRET never reaches the gate and requiring "secret" fails closed
# forever), and the v5.8.0+ gate also fires on bare branch pushes. Leaving
# osv-verdict at v5.7.0 -- which does not -- would leave the gate demanding
# a CHECK_OSV that never emits on every branch push. The verdict pin has
# to move with the gate.
include:
  - component: gitlab.com/nomograph/pipeline/osv-verdict@v5.14.0
    inputs:
      scan_path: "sdk"
  - component: gitlab.com/nomograph/pipeline/secret-verdict@v5.14.0
    inputs:
      stage: verdict
  - component: gitlab.com/nomograph/pipeline/automerge-gate@v5.14.0
    inputs:
      required-checks: "osv,secret"

# --- Check ---

# Jobs with no rules: inherit the legacy `only: [branches, tags]` default,
# which SKIPS merge_request_event pipelines -- these three check jobs
# carried no rules at all, so they ran on pushes to main but were silently
# absent from every MR pipeline. The MR pipeline is the head pipeline the
# automerge-gate component's only_allow_merge_if_pipeline_succeeds reads,
# so a job absent from it does not gate the merge. Same bug, same fix as
# nomograph/reference's .on-mr-and-main.
.on-mr-and-main:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

typecheck-worker:
  stage: check
  extends: .on-mr-and-main
  image: node:24-slim@sha256:3638d9a6fe4030bd716be989438248074489337ba3275657f93595428be4fc03
  script:
    - cd worker && npm ci && npx tsc --noEmit
  cache:
    key: worker-${CI_COMMIT_REF_SLUG}
    paths:
      - worker/node_modules/

test-sdk:
  stage: check
  extends: .on-mr-and-main
  image: golang:1.26@sha256:7caba5286b4c3613a337b709c573047d8ae62ee76106647313b61e72b99f20af
  script:
    - cd sdk && go test -v ./...

check-agent:
  stage: check
  extends: .on-mr-and-main
  image: $RUST_IMAGE
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends
        libatk1.0-dev libgtk-3-dev libglib2.0-dev libpango1.0-dev
        libgdk-pixbuf-2.0-dev libcairo2-dev
  script:
    - cd agent && cargo check
  cache:
    key: agent-${CI_COMMIT_REF_SLUG}
    paths:
      - .cargo/
      - agent/target/

# --- Build release binaries (on tags only) ---

.build-agent:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  cache:
    key: agent-release-${TARGET}
    paths:
      - .cargo/
      - agent/target/
  artifacts:
    paths:
      - agent/target/${TARGET}/release/behest-agent
    expire_in: 1 week

build-macos-arm64:
  extends: .build-agent
  tags: [macos, arm64]
  variables:
    TARGET: aarch64-apple-darwin
  script:
    - cd agent && cargo build --release
    - mkdir -p target/${TARGET}/release
    - cp target/release/behest-agent target/${TARGET}/release/

build-macos-x86_64:
  extends: .build-agent
  tags: [macos, x86_64]
  variables:
    TARGET: x86_64-apple-darwin
  script:
    - cd agent && cargo build --release
    - mkdir -p target/${TARGET}/release
    - cp target/release/behest-agent target/${TARGET}/release/

build-linux-amd64:
  extends: .build-agent
  image: $RUST_IMAGE
  variables:
    TARGET: x86_64-unknown-linux-gnu
  script:
    - cd agent && cargo build --release --target ${TARGET}

build-linux-arm64:
  extends: .build-agent
  image: $RUST_IMAGE
  tags: [arm64]
  variables:
    TARGET: aarch64-unknown-linux-gnu
  script:
    - apt-get update && apt-get install -y gcc-aarch64-linux-gnu
    - cd agent
    - rustup target add ${TARGET}
    - export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
    - cargo build --release --target ${TARGET}

# --- Release ---

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest@sha256:3f52d526f48e8d10625c722fa6d6423ee82aadeae1b1aa91f07b62551d96dacf
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/
  needs:
    - build-macos-arm64
    - build-macos-x86_64
    - build-linux-amd64
    - build-linux-arm64
  script:
    - echo "Creating release ${CI_COMMIT_TAG}"
  release:
    tag_name: ${CI_COMMIT_TAG}
    name: "behest ${CI_COMMIT_TAG}"
    description: "Release ${CI_COMMIT_TAG}"
    assets:
      links:
        - name: behest-agent-macos-arm64
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/agent/target/aarch64-apple-darwin/release/behest-agent?job=build-macos-arm64"
        - name: behest-agent-macos-x86_64
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/agent/target/x86_64-apple-darwin/release/behest-agent?job=build-macos-x86_64"
        - name: behest-agent-linux-amd64
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/agent/target/x86_64-unknown-linux-gnu/release/behest-agent?job=build-linux-amd64"
        - name: behest-agent-linux-arm64
          url: "${CI_PROJECT_URL}/-/jobs/artifacts/${CI_COMMIT_TAG}/raw/agent/target/aarch64-unknown-linux-gnu/release/behest-agent?job=build-linux-arm64"
